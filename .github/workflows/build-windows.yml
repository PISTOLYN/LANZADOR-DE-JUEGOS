name: Build Windows installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json, main.js, preload.js, index.html, style.css, app.js, .github/workflows/build-windows.yml]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build 32-bit and 64-bit installers
        run: npm run dist
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ARCADE-LAUNCHER-WINDOWS-INSTALLERS
          path: dist/*.exe
          if-no-files-found: error